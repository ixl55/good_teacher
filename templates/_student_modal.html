{% from "_icons.html" import icon %}
<div class="modal-backdrop" id="student-modal" role="dialog" aria-modal="true" aria-labelledby="student-modal-title">
    <div class="modal">
        <div class="modal-header">
            <h3 id="student-modal-title">{{ t('modal_add_student') }}</h3>
            <button class="icon-btn" data-close-modal="student-modal" aria-label="{{ t('close') }}">{{ icon('close') }}</button>
        </div>
        <div class="modal-body">
            <form id="student-form" onsubmit="event.preventDefault(); saveStudent();">
                <input type="hidden" id="student-id">
                <div class="form-group">
                    <label for="student-name">{{ t('field_name') }} <span class="required">*</span></label>
                    <input type="text" class="form-control" id="student-name" required placeholder="{{ t('ph_name') }}">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-class">{{ t('field_class') }}</label>
                        <input type="text" class="form-control" id="student-class" placeholder="{{ t('ph_class') }}">
                    </div>
                    <div class="form-group">
                        <label for="student-section">{{ t('field_section') }}</label>
                        <input type="text" class="form-control" id="student-section" placeholder="{{ t('ph_section') }}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="student-notes">{{ t('field_notes') }}</label>
                    <textarea class="form-control" id="student-notes" placeholder="{{ t('ph_notes') }}"></textarea>
                </div>
                <button type="submit" hidden></button>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" data-close-modal="student-modal">{{ t('cancel') }}</button>
            <button class="btn btn-primary" id="btn-save-student">{{ t('save') }}</button>
        </div>
    </div>
</div>
